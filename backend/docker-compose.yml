version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ytaudio
      POSTGRES_PASSWORD: ytaudio
      POSTGRES_DB: ytaudio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytaudio"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://ytaudio:ytaudio@db:5432/ytaudio"
      DATA_DIR: "/data"
    volumes:
      - ytdata:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  ytdata:
