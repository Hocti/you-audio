version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ytaudio
      POSTGRES_PASSWORD: ytaudio
      POSTGRES_DB: ytaudio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytaudio"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Fetches PO Tokens for yt-dlp's bgutil plugin (requirements.txt). YouTube
  # 403s most media URLs without one — see downloader.py's POT_PROVIDER_URL.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://ytaudio:ytaudio@db:5432/ytaudio"
      DATA_DIR: "/data"
      ACCESS_TOKEN: ""
      POT_PROVIDER_URL: "http://pot-provider:4416"
    volumes:
      - ytdata:/data
    depends_on:
      db:
        condition: service_healthy
      pot-provider:
        condition: service_started

volumes:
  pgdata:
  ytdata:
