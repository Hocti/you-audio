name: you_audio
description: You Audio Player
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.0
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  audio_session: ^0.1.18
  cached_network_image: ^3.3.0
  provider: ^6.1.1
  path_provider: ^2.1.0
  # Keeps downloads alive when the app is backgrounded (Android foreground svc).
  flutter_foreground_task: ^8.0.0
  # Opens YouTube links in the YouTube app / browser ("Open in YouTube").
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
